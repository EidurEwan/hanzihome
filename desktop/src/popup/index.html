<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>HanziHome word</title>
<!-- the site's own styles, so this is the reader's word popup exactly -->
<link rel="stylesheet" href="../../../site/style.css">
<style>
  html, body { margin: 0; background: var(--panel); overflow: hidden; }
  body { border: 1px solid var(--line-2); border-radius: 0; }
  /* its own size, not the window's: the window is fitted to this, so a width taken
     from the window could only ever stay or shrink. No pop-in animation either: it
     scales the popup down while it is measured. */
  #word-pop, #word-pop:not([hidden]) { position: static; box-shadow: none; border: 0; border-radius: 0;
    width: max-content; min-width: 230px; max-width: 360px; animation: none; transform: none; }
  .wp-c { cursor: pointer; text-decoration: none; }
  .wp-card { cursor: pointer; }
</style>
</head>
<body>
<div id="word-pop"></div>
<script src="popup.js"></script>
</body>
</html>
