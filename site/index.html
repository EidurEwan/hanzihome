<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HanziHome — learn Chinese characters, words and reading</title>
<link rel="stylesheet" href="style.css?v=295">
<link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2128" media="(prefers-color-scheme: dark)">
<!-- iPhone and iPad, added to the home screen: its name under the icon, and the status bar
     drawn over the page's own colour -->
<meta name="apple-mobile-web-app-title" content="HanziHome">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* Settings → Appearance: light or dark whatever the device prefers (app.js setTheme),
   and the colour theme (app.js setPalette) */
try { var _t = localStorage.getItem('hanzihome.theme'); if (_t === 'light' || _t === 'dark') document.documentElement.dataset.theme = _t; } catch (e) {}
/* (Ocean, the blue, when nothing is chosen; Sunshine is the stylesheet's own colours) */
var _p = null; try { _p = localStorage.getItem('hanzihome.palette'); } catch (e) {}
if (!/^[a-z]+$/.test(_p || '')) _p = 'ocean';
if (_p !== 'sunshine') document.documentElement.dataset.palette = _p;
/* Globals the data files assign into. Everything is loaded with <script>
   tags rather than fetch(), so the site works straight off the filesystem. */
var HZ = { index: {}, chunk: {}, strokes: {}, phoneticSets: {}, meta: {}, radicalMap: {} };
</script>
</head>
<body>
<a class="skip-link" href="#app">Skip to content</a>
<div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<header class="topbar">
  <button id="sidebar-toggle" class="menu-btn" aria-label="Menu" title="Menu (M)" aria-keyshortcuts="M" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="#/study"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
    <!-- logo.svg, inline so its square takes the colour theme's face -->
    <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="var(--yellow, #6db8ff)" stroke="#222222" stroke-width="2.2"/>
    <path d="M16 3v26M3 16h26" stroke="#222222" stroke-width="1" stroke-dasharray="1.6 1.6" opacity=".3"/>
    <g transform="translate(4 3.6) scale(.75)" fill="none" stroke="#222222" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 3.8V6.2"/><path d="M6.5 11V8.2H25.5V11"/><path d="M10.5 13.5H21.5L17 17.5"/>
      <path d="M16.8 17.5V26.5Q16.8 28.8 14.2 28"/><path d="M6.5 21.2H25.5"/></g></svg><span>HanziHome</span></a>
  <form class="search" id="search-form" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search characters, words, pinyin or English" enterkeyhint="search"
           spellcheck="false" autocorrect="off" autocapitalize="off" aria-label="Search characters and words, by character, pinyin or English">
    <button class="btn" type="submit" aria-label="Search">Search</button>
    <div id="ac" class="ac" hidden></div>
  </form>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <!-- the profile header: your HSK level and how far through it you are (it leads to that
         level's list), then the streak and what you know (they lead to Statistics);
         app.js paintProfile fills it -->
    <section class="player" aria-label="Your progress">
      <a class="pf-level" id="pf-level" href="#/hsk-1">
        <span class="pf-head"><b id="pf-title">HSK 1 learner</b><span id="pf-sub">0 / 0</span></span>
        <span class="pf-track" id="pf-bar" role="progressbar" aria-labelledby="pf-title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pf-fill"></i></span>
      </a>
      <!-- the numbers lead to the whole story, on Statistics -->
      <a class="player-stats" href="#/stats" aria-label="Statistics">
        <div><span><img src="img/flame.svg" alt=""><b id="pc-streak">0</b></span>week streak</div>
        <div><span><b id="pc-learned">0</b></span>characters</div>
        <div><span><b id="pc-words">0</b></span>words</div>
      </a>
    </section>
    <!-- the menu: the four places you come to do something, as cards, then the rest as quiet
         rows, then your own things (app.js markNav lights the entry a page belongs to) -->
    <nav aria-label="Menu">
      <a class="main" href="#/study" data-nav="/study"><span class="ico pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5 12 4l10 4.5-10 4.5zM6 11v4.6c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6V11"/></svg></span><span class="lbl">Today <i id="due-badge" class="badge" hidden></i><span id="due-sr" class="sr-only"></span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
      <a class="main" href="#/practice" data-nav="/practice"><span class="ico yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg></span><span class="lbl">Practice</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
      <a class="main" href="#/reader" data-nav="/reader"><span class="ico sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg></span><span class="lbl">Reader</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
      <a class="main" href="#/words" data-nav="/words"><span class="ico mint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM8 9.5h8M8 12.5h5"/></svg></span><span class="lbl">Words</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
      <div class="nav-rows">
      <a href="#/hsk-1" data-nav="/explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.6 8.4-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg> Characters &amp; lists</a>
      <a href="#/translate" data-nav="/translate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h9M7.5 3v2M5 5c.9 3.2 2.8 5.6 5.5 7M10 5c-.9 3.3-3 5.9-6.5 7.5M12.5 21l4-9 4 9M13.8 18h5.4"/></svg> Translate</a>
      <a href="#/screen" data-nav="/screen" id="nav-screen" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M8 9.5h3M13 9.5h3M8 12.5h5"/></svg> On screen now</a>
      </div>
      <div class="nav-rows yours">
      <a href="#/lists" data-nav="/yours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg> Lists &amp; notes</a>
      <a href="#/stats" data-nav="/stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg> Statistics</a>
      <a href="#/settings" data-nav="/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM12 2.5v2.6M12 18.9v2.6M4.3 4.3l1.9 1.9M17.8 17.8l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.3 19.7l1.9-1.9M17.8 6.2l1.9-1.9"/></svg> Settings</a>
      </div>
    </nav>
    <!-- on a wide screen the menu can stay open beside the page (app.js setPin) -->
    <button type="button" class="nav-pin" id="nav-pin" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg> <span>Keep the menu open</span></button>
    <!-- where your data is; it leads to Settings → Sync -->
    <a class="side-foot" href="#/settings" data-scroll="sync-card">
      <span class="who" id="side-who">Local profile</span>
      <span class="small muted" id="side-sub">Everything is stored in this browser.</span>
    </a>
  </aside>

  <nav id="hub-tabs" class="tabs hub-tabs" hidden></nav>
  <main id="app" tabindex="-1"></main>
</div>
