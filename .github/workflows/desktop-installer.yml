# Builds the Windows installer (desktop/dist/HanziHome Setup x.y.z.exe) and attaches it to a
# GitHub Release. Runs on a pushed tag like v0.1.0, or by hand from the Actions tab.
# It has to run on Windows: the OCR helper is compiled with the C# compiler that ships there.
name: Desktop installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: HanziHome-installer
          path: desktop/dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
