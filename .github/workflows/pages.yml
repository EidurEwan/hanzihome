# Publishes site/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Each attempt uploads its own artifact. "Re-run" reuses the same workflow run, so a
      # fixed name would leave two "github-pages" artifacts in it, and deploy-pages refuses
      # to choose between them ("Multiple artifacts named github-pages ...").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      # The artifact can take a few seconds to be listed after its upload; deploy-pages
      # looking for it straight away fails with "No artifacts named ... were found".
      # So wait, and if it still isn't there, wait longer and try once more.
      - run: sleep 15
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
